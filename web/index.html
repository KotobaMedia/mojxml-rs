<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f5f5;
        color: #222;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
      }
      #drop-area {
        border: 2px dashed #888;
        border-radius: 8px;
        padding: 3rem 1rem;
        text-align: center;
        background: #fff;
        transition: border-color 0.2s ease, background-color 0.2s ease;
        cursor: pointer;
      }
      #drop-area.highlight {
        border-color: #0a66ff;
        background-color: #eef3ff;
      }
      #status {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 3rem;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Parse XML with mojxml</h1>
      <div id="drop-area">Drag &amp; drop an XML file here, or click to select one.</div>
      <input type="file" id="file-input" accept=".xml,text/xml" hidden />
      <pre id="status" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
