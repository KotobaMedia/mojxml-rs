<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mojxml web version</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f5f5;
        color: #222;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
      }
      #drop-area {
        border: 2px dashed #888;
        border-radius: 8px;
        padding: 3rem 1rem;
        text-align: center;
        background: #fff;
        transition: border-color 0.2s ease, background-color 0.2s ease;
        cursor: pointer;
      }
      #drop-area.highlight {
        border-color: #0a66ff;
        background-color: #eef3ff;
      }
      #status {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 3rem;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      #map {
        height: 480px;
        margin-top: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        background: #dcdcdc;
      }
      .feature-info-control {
        max-width: 320px;
        max-height: 200px;
        overflow: auto;
        padding: 0.5rem;
        font-size: 0.875rem;
        line-height: 1.4;
        background: rgba(255, 255, 255, 0.95);
        color: #222;
        border-radius: 4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .feature-info-control table {
        width: 100%;
        border-collapse: collapse;
      }
      .feature-info-control tr:nth-child(odd) {
        background: rgba(9, 30, 66, 0.05);
      }
      .feature-info-key,
      .feature-info-value {
        padding: 0.25rem 0.4rem;
        vertical-align: top;
        word-break: break-word;
      }
      .feature-info-key {
        font-weight: 600;
        white-space: nowrap;
        padding-right: 0.75rem;
      }
      .feature-info-empty {
        padding: 0.25rem 0;
        color: #555;
      }
      @media (prefers-color-scheme: dark) {
        .feature-info-control {
          background: rgba(28, 28, 28, 0.9);
          color: #f0f0f0;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
        .feature-info-control tr:nth-child(odd) {
          background: rgba(240, 240, 240, 0.08);
        }
        .feature-info-empty {
          color: #bbb;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>地図XMLを mojxml-rs で読み込む</h1>
      <div id="drop-area">解凍した地図XMLファイルをここにドラッグ＆ドロップするか、クリックして選択してください。</div>
      <input type="file" id="file-input" accept=".xml,text/xml" hidden />
      <pre id="status" aria-live="polite"></pre>
      <div id="map" role="region" aria-label="Parsed GeoJSON preview"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
