[package]
name = "mojxml-rs"
authors = ["Keitaroh Kobayashi <keita@kotobamedia.com>"]
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
flatgeobuf = { version = "5.0", default-features = false }
geo-types = "0.7"
geojson = "0.24.2"
geoparquet-batch-writer = "0.1.4"
geozero = "0.14"
indicatif = "0.18"
log = "0.4"
num_cpus = "1"
polylabel = "3.2.0"
proj4rs = "0.1.8"
roxmltree = "0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tempfile = "3"
thiserror = "1"
zip = "4.3"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.0" }

[profile.release]
# debug = true
codegen-units = 1
lto = false
panic = "abort"
